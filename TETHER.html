/* ============================================================ tokens
 * One world with the author's site and Chess Analyzer: green-black and bone,
 * one jade accent, a tall condensed face for the words and numbers that
 * matter and a plain public sans for the rest. Surfaces are told apart by
 * tone, not by borders and glows. Canvas chrome reads the same values from
 * src/theme.js. */
:root {
  --bg: #121715;
  --bg-deep: #0d110f;
  --panel: #1a211f;
  --panel2: #232c29;
  --panel3: #2c3733;
  --ink: #e4e1d3;
  --ink-soft: #c9c8bc;
  --muted: #9aa29b;
  --faint: #6b746d;
  --line: #2e3935;
  --accent: #9fc7b8;
  --accent-ink: #a9d0c1;
  --on-accent: #121715;
  --gold: #e3cf5c;
  --good: #86bd5c;
  --bad: #e0725a;
  --scrim: rgba(13, 17, 15, 0.8);
  --display: 'Big Shoulders', 'Arial Narrow', sans-serif;
  --text: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 6px;
  --r-sm: 4px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --float: 0 18px 48px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

html, body {
  margin: 0;
  /* a game surface, never a scrolling page: the artboard is authored at
   * 1120px and scaled down, and its unscaled box must not widen a phone's
   * layout viewport (that made fitCanvas size for a too-wide window) */
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--text);
  -webkit-font-smoothing: antialiased;
  scrollbar-color: var(--panel3) var(--panel);
}
::selection { background: var(--accent); color: var(--on-accent); }
#wrap {
  position: relative; /* positioning context for the #ui-root artboard */
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}

/* shared icon + key-cap primitives (icons.js) */
.ic {
  width: 18px; height: 18px;
  display: block; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}
.ic-fill { fill: currentColor; stroke: none; }
kbd {
  display: inline-block;
  min-width: 1.7em;
  padding: 1px 6px;
  margin: 0 1px;
  border-radius: var(--r-sm);
  background: var(--panel2);
  color: var(--ink);
  font: 600 11px/1.5 var(--text);
  text-align: center;
}

/* DOM overlay artboard (created in uiRoot.js): a VIEW_W×VIEW_H surface
 * pinned to the canvas center and scaled as ONE unit — children are authored
 * in artboard px, the same numbers as canvas VIEW coordinates. fitCanvas()
 * sets --ui-scale from the same rounding as the canvas CSS size.
 * transform-origin stays at the default 50% 50%: translate(-50%,-50%) pins
 * the artboard center to the wrap center and scale() grows it symmetrically,
 * which is exactly how the flex-centered canvas letterboxes.
 * pointer-events:none — gameplay mouse falls through to the canvas (which
 * keeps cursor:none); interactive DOM chrome opts back in below and gets a
 * real CSS cursor. */
#ui-root {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(var(--ui-scale, 1));
  pointer-events: none;
}
#ui-root button {
  pointer-events: auto;
  cursor: pointer;
}
/* roving focus draws its own .focused state — the UA default ring would
 * double-outline every focused card/chip */
#ui-root button:focus { outline: none; }
#game {
  max-width: 100%;
  cursor: none;
  /* the canvas fills the window now — no card chrome around it */
}
#legend { display: none; } /* controls live in SETTINGS + README now */
#legend .hl { color: var(--accent); }
#wrap:fullscreen {
  background: var(--bg-deep);
  gap: 0;
}
#wrap:fullscreen #legend { display: none; }
/* fullscreen: the canvas keeps its fixed backing store; only its CSS size
 * grows (aspect-correct, set by fitCanvas). Drop windowed chrome so the
 * upscaled bitmap meets the letterbox with a clean edge. */
#wrap:fullscreen #game {
  border-radius: 0;
  outline: none;
  box-shadow: none;
}

/* ============================================================ account chip
 * inside #wrap so fullscreen keeps them. (#wrap is what toggleFullscreen()
 * fullscreens; a fullscreened element is the containing block for its
 * fixed-position descendants, so these keep their corner in BOTH modes.) */
#auth-chip {
  position: fixed;
  top: 10px;
  right: 12px;
  z-index: 51;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 10px 0 9px;
  background: var(--panel);
  border: none;
  border-radius: var(--r-sm);
  color: var(--ink-soft);
  font: 600 13px var(--text);
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}
#auth-chip .ic { width: 16px; height: 16px; }
#auth-chip .ic-chevronDown { width: 14px; height: 14px; color: var(--muted); }
#auth-chip:hover { background: var(--panel2); color: var(--ink); }
#auth-chip.authed { color: var(--ink); }
#auth-chip.authed .ic-user { color: var(--accent); }
#auth-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#auth-panel {
  position: fixed;
  top: 48px;
  right: 12px;
  z-index: 50;
  width: 220px;
  box-sizing: border-box;
  background: var(--panel);
  border-radius: var(--r);
  box-shadow: var(--float);
  padding: 12px;
  font: 13px var(--text);
  color: var(--ink-soft);
  display: none;
}
#auth-panel.open { display: block; }
#auth-panel .auth-status {
  display: none;
  color: var(--ink);
  margin-bottom: 10px;
  word-break: break-all;
}
#auth-panel .auth-error {
  display: none;
  color: var(--bad);
  margin-bottom: 6px;
}
#auth-panel .auth-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#auth-panel input {
  box-sizing: border-box;
  width: 100%;
  height: 36px;
  padding: 0 10px;
  background: var(--panel2);
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  color: var(--ink);
  font: inherit;
}
#auth-panel input::placeholder { color: var(--muted); opacity: 1; }
#auth-panel input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
#auth-panel button {
  width: 100%;
  height: 36px;
  padding: 0 10px;
  background: var(--accent);
  border: none;
  border-radius: var(--r-sm);
  color: var(--on-accent);
  font: 600 13px var(--text);
  cursor: pointer;
  transition: background-color 0.15s ease, transform 0.16s var(--ease-out);
}
#auth-panel button:hover { background: var(--accent-ink); }
#auth-panel button:active { transform: scale(0.97); }
#auth-panel > button {
  display: none;
  margin-bottom: 8px;
  background: var(--panel2);
  color: var(--ink);
}
#auth-panel > button:hover { background: var(--panel3); }
#auth-panel .auth-toggle {
  height: auto;
  background: transparent;
  border: none;
  color: var(--muted);
  font: 12px var(--text);
  text-decoration: underline;
  text-underline-offset: 0.22em;
  padding: 2px 0;
}
#auth-panel .auth-toggle:hover { background: transparent; color: var(--ink); }

/* ============================================================ corner buttons
 * leaderboard trophy (+ admin gear) — top-left artboard corner, inside
 * #ui-root (artboard px; scales with the canvas). The select header is
 * centered, so this corner is clear. */
#lb-open-btn, #admin-open-btn {
  position: absolute;
  top: 22px;
  z-index: 50;
  width: 36px;
  height: 36px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: none;
  border-radius: var(--r-sm);
  color: var(--ink-soft);
  transition: background-color 0.15s ease, color 0.15s ease;
}
#lb-open-btn { left: 24px; }
#admin-open-btn { left: 66px; }
#lb-open-btn .ic, #admin-open-btn .ic { width: 19px; height: 19px; }
#lb-open-btn:hover, #admin-open-btn:hover { background: var(--panel2); color: var(--ink); }

/* ============================================================ modals
 * leaderboard / achievements + admin — they float, so they get the one
 * real shadow in the system */
#lb-modal-overlay, #admin-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--scrim);
  align-items: center;
  justify-content: center;
}
#lb-modal, #admin-modal {
  width: min(440px, 92vw);
  max-height: min(580px, 84vh);
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-radius: var(--r);
  box-shadow: var(--float);
  overflow: hidden;
  font-family: var(--text);
}
.lb-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 8px 0 18px;
  box-shadow: inset 0 -1px 0 var(--line);
}
.lb-tabs { display: flex; gap: 22px; }
.lb-tabs button {
  padding: 12px 0 13px;
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: inset 0 -2px 0 transparent;
  color: var(--muted);
  font: 600 14px var(--text);
  cursor: pointer;
  transition: color 0.15s ease, box-shadow 0.24s var(--ease-out);
}
.lb-tabs button.active { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.lb-tabs button:hover { color: var(--ink); }
.lb-close {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: var(--r-sm);
  color: var(--muted);
  cursor: pointer;
  padding: 0;
}
.lb-close:hover { background: var(--panel2); color: var(--ink); }
.lb-body {
  flex: 1 1 auto;
  min-height: 0;
  max-height: 360px;
  overflow-y: auto;
  padding: 14px 18px 16px;
  font-size: 13px;
  color: var(--ink-soft);
  scrollbar-width: thin;
  scrollbar-color: var(--panel3) var(--panel);
}
.lb-body::-webkit-scrollbar { width: 8px; }
.lb-body::-webkit-scrollbar-track { background: var(--panel); }
.lb-body::-webkit-scrollbar-thumb { background: var(--panel3); border-radius: 4px; }
.lb-body::-webkit-scrollbar-thumb:hover { background: var(--muted); }
.lb-section-title {
  color: var(--ink);
  font: 800 20px/1 var(--display);
  text-transform: uppercase;
  margin: 6px 0 8px;
}
.lb-section-title + .lb-row { margin-top: 0; }
.lb-body > .lb-section-title:not(:first-child) { margin-top: 20px; }
.lb-empty {
  color: var(--muted);
  text-align: center;
  padding: 30px 0;
}
.lb-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  box-shadow: inset 0 -1px 0 var(--line);
}
.lb-row:last-child { box-shadow: none; }
.lb-rank { color: var(--muted); width: 20px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.lb-name { flex: 1; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-time { color: var(--ink); flex-shrink: 0; font: 700 16px/1 var(--display); font-variant-numeric: tabular-nums; }
.lb-time-none { color: var(--faint); font: 13px var(--text); }
/* rank chip in the Best Times list — matches the results-screen grade colors */
.lb-grade {
  width: 18px; flex-shrink: 0; text-align: center;
  font: 800 17px/1 var(--display);
}
.lb-grade-S { color: var(--gold); }
.lb-grade-A { color: var(--accent); }
.lb-grade-B { color: #b0c48a; }
.lb-grade-C { color: var(--muted); }
.lb-grade-none { color: var(--faint); }
.lb-foot {
  color: var(--muted);
  text-align: center;
  padding: 14px 0 2px;
  font-size: 12px;
}

.lb-pagination {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 10px 14px 14px;
  box-shadow: inset 0 1px 0 var(--line);
}
.lb-page-btn {
  width: 32px;
  height: 32px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel2);
  border: none;
  border-radius: var(--r-sm);
  color: var(--ink);
  cursor: pointer;
}
.lb-page-btn:hover:not(:disabled) { background: var(--panel3); }
.lb-page-btn:disabled { opacity: 0.35; cursor: default; }
.lb-page-label { color: var(--ink-soft); font-size: 13px; min-width: 120px; text-align: center; }

/* admin modal */
.admin-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.admin-upload-title { margin-top: 14px; }
.admin-action-btn {
  height: 38px;
  padding: 0 14px;
  background: var(--panel2);
  border: none;
  border-radius: var(--r-sm);
  color: var(--ink);
  font: 600 13px var(--text);
  cursor: pointer;
}
.admin-action-btn:hover { background: var(--panel3); }
.admin-name-input, .admin-json-textarea {
  box-sizing: border-box;
  width: 100%;
  padding: 8px 10px;
  background: var(--panel2);
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  color: var(--ink);
  font: 13px var(--text);
}
.admin-json-textarea { font: 12px ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; resize: vertical; }
.admin-name-input:focus, .admin-json-textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.admin-name-input::placeholder, .admin-json-textarea::placeholder { color: var(--muted); opacity: 1; }
.admin-file-input { color: var(--muted); font-size: 12px; }
.admin-status { min-height: 16px; font-size: 12px; color: var(--muted); }
.admin-status-ok { color: var(--good); }
.admin-status-error { color: var(--bad); }
/* the online-levels manage list */
.admin-level-list {
  max-height: 190px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 13px;
  color: var(--muted);
}
.admin-level-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 6px 6px 10px;
  background: var(--panel2);
  border-radius: var(--r-sm);
}
.admin-level-name {
  color: var(--ink);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.admin-level-meta { font-size: 12px; white-space: nowrap; }
.admin-level-override { color: var(--gold); }
.admin-del-btn {
  min-width: 28px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: var(--r-sm);
  color: var(--bad);
  font: 600 12px var(--text);
  padding: 0 6px;
  cursor: pointer;
}
.admin-del-btn .ic { width: 16px; height: 16px; }
.admin-del-btn:hover { background: var(--panel3); }
.admin-del-btn:disabled { opacity: 0.5; cursor: default; }

/* ============================================================ DOM screens
 * Authored on the #ui-root artboard in VIEW-space px (1120×630), so canvas
 * HUD lanes and DOM UI share one coordinate system. */
.screen, .screen * { box-sizing: border-box; } /* fixed boxes — focus styles must never reflow the grid */

/* each screen fills the artboard; pointer-events:auto gives the whole surface
 * a real cursor (the canvas keeps cursor:none for gameplay) */
#screen-select {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: auto;
  cursor: default;
  font-family: var(--text);
  color: var(--ink);
  user-select: none;
}
.screen button { font-family: var(--text); }

/* ---- header: wordmark, then one row — world switch, world name, LINE ---- */
.sel-head {
  position: absolute;
  top: 18px;
  left: 0; right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.sel-title {
  font: 800 50px/1 var(--display);
  color: var(--ink);
  letter-spacing: 0.01em;
}
.sel-worldnav {
  margin-top: 8px;
  height: 34px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sel-subtitle {
  min-width: 250px;
  padding: 0 10px;
  text-align: center;
  font: 600 15px/1 var(--text);
  color: var(--ink);
  white-space: nowrap;
}
.sel-subtitle .sel-wnum { color: var(--muted); font-weight: 400; }
.sel-chip {
  height: 34px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--panel);
  border: none;
  border-radius: var(--r-sm);
  color: var(--ink-soft);
  font: 600 13px var(--text);
  transition: background-color 0.15s ease, color 0.15s ease;
}
.sel-arrow, .sel-worldnew { width: 34px; }
.sel-line { padding: 0 12px 0 10px; margin-left: 14px; }
.sel-line .ic { width: 16px; height: 16px; }
.sel-chip.focused, .sel-chip:hover { background: var(--panel3); color: var(--ink); }
.sel-chip.focused { box-shadow: inset 0 0 0 2px var(--accent); }

/* ---- grid ---- */
.sel-grid {
  position: absolute;
  top: 160px;
  left: 0; right: 0;
  margin: 0 auto; /* with max-width (set in buildGrid) → centered 4-wide rows */
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  justify-content: center;
  gap: 18px; /* overridden per-world in buildGrid (scales with k) */
  --cw: 196px;
  --ch: 172px;
  --k: 1;
}
.sel-grid.sel-grid-top { top: 130px; }
.sel-empty { color: var(--muted); font-size: 15px; margin-top: 80px; }

.sel-card {
  position: relative;
  width: var(--cw);
  height: var(--ch);
  padding: 0;
  background: var(--panel);
  border: none;
  border-radius: var(--r);
  text-align: left;
  color: var(--ink);
  transition: background-color 0.15s ease;
}
/* the BODY holds the drawing; the card's hit geometry and its corner chips
 * stay pinned (chips never move under the cursor; ROADMAP checklist A) */
.sel-cardbody {
  position: absolute;
  inset: 0;
  padding: calc(7px * var(--k));
  border-radius: var(--r);
  overflow: hidden;
  pointer-events: none; /* hits belong to the card button + chips */
}
.sel-card.flipped { background: var(--panel2); }
.sel-card:hover { background: var(--panel2); }
.sel-card.focused {
  background: var(--panel2);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.sel-thumb {
  position: relative;
  width: 100%;
  height: 57%;
  border-radius: var(--r-sm);
  overflow: hidden;
}
.sel-thumb canvas { width: 100%; height: 100%; display: block; }
.sel-lockface {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-soft);
}
.sel-lockface .ic { width: calc(26px * var(--k)); height: calc(26px * var(--k)); }
.sel-rank {
  position: absolute;
  top: calc(7px * var(--k) + 5px);
  right: calc(7px * var(--k) + 5px);
  min-width: calc(26px * var(--k));
  padding: 3px 4px 2px;
  text-align: center;
  background: var(--bg);
  border-radius: var(--r-sm);
  font: 800 calc(19px * var(--k))/1 var(--display);
}
.sel-name {
  display: flex;
  align-items: baseline;
  gap: calc(6px * var(--k));
  margin-top: calc(9px * var(--k));
  padding: 0 3px;
  font: 600 calc(14px * var(--k))/1.2 var(--text);
  color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sel-num {
  flex: none;
  font: 800 calc(17px * var(--k))/1 var(--display);
  color: var(--muted);
}
.sel-card.focused .sel-num { color: var(--accent); }
.sel-name-t { overflow: hidden; text-overflow: ellipsis; }
.sel-tag {
  padding: 0 3px;
  margin-top: calc(3px * var(--k));
  font: calc(11.5px * var(--k))/1.3 var(--text);
  color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sel-cardfoot {
  position: absolute;
  left: calc(7px * var(--k) + 3px);
  right: calc(7px * var(--k) + 3px);
  bottom: calc(9px * var(--k));
  display: flex;
  align-items: center;
  justify-content: space-between;
  font: calc(12px * var(--k))/1 var(--text);
}
.sel-best { color: var(--ink); font: 700 calc(16px * var(--k))/1 var(--display); font-variant-numeric: tabular-nums; }
.sel-best.none { color: var(--faint); font: calc(12px * var(--k))/1 var(--text); }
.sel-coins { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sel-coins .ic { width: calc(12px * var(--k)); height: calc(12px * var(--k)); color: var(--faint); }
.sel-coins.full { color: var(--gold); }
.sel-coins.full .ic { color: var(--gold); }
.sel-lockprog { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-soft); }
.sel-lockprog .ic { width: 13px; height: 13px; }
/* flipped face: the A-side chip owns the bottom-left corner — indent the lock
 * progress past it */
.sel-card.flipped .sel-cardfoot { padding-left: 34px; }

/* corner chips — mouse + hotkey (never arrow-focused) */
.sel-x, .sel-bchip {
  position: absolute;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border: none;
  border-radius: var(--r-sm);
  font: 700 11px var(--text);
  line-height: 1;
}
.sel-x .ic, .sel-bchip .ic { width: 13px; height: 13px; stroke-width: 2.2; }
.sel-x {
  top: 9px; left: 9px;
  width: 22px; height: 22px;
  background: var(--bg);
  color: var(--ink-soft);
}
.sel-x:hover { background: var(--bad); color: var(--on-accent); }
.sel-bchip {
  bottom: 7px; right: 7px;
  width: 36px; height: 22px;
  background: var(--bg);
  color: var(--ink-soft);
}
.sel-bchip.back { left: 7px; right: auto; }
.sel-bchip:hover { background: var(--accent); color: var(--on-accent); }

/* ---- footer ---- */
.sel-footer {
  position: absolute;
  top: 500px;
  display: flex;
  gap: 10px;
}
.sel-fbtn {
  width: 196px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--panel);
  border: none;
  border-radius: var(--r-sm);
  color: var(--ink);
  font: 600 13px var(--text);
  transition: background-color 0.15s ease;
}
.sel-fbtn .ic { width: 17px; height: 17px; color: var(--muted); }
.sel-fbtn .sel-count { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.sel-fbtn.focused, .sel-fbtn:hover { background: var(--panel3); }
.sel-fbtn.focused { box-shadow: inset 0 0 0 2px var(--accent); }
.sel-swatch { width: 12px; height: 12px; flex: 0 0 auto; border-radius: 3px; }

/* ---- hint lines ---- */
.sel-hints {
  position: absolute;
  top: 548px;
  left: 0; right: 0;
  text-align: center;
}
.sel-hint { font: 12px/24px var(--text); color: var(--muted); white-space: nowrap; }
.sel-hint kbd { font-size: 10.5px; padding: 0 5px; background: var(--panel); color: var(--ink-soft); }

/* ---- delete-confirm modal (in-screen; scrim gates the cards) ---- */
.sel-confirm {
  position: absolute;
  inset: 0;
  z-index: 30;
  background: var(--scrim);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}
.sel-confirm-box {
  width: 460px;
  padding: 28px 28px 24px;
  background: var(--panel);
  border-radius: var(--r);
  box-shadow: var(--float);
  text-align: left;
  transform: translateY(-20px);
}
.sel-confirm-title { font: 600 19px/1.3 var(--text); color: var(--ink); }
.sel-confirm-sub { margin-top: 8px; font: 14px/1.5 var(--text); color: var(--muted); }
.sel-confirm-row { margin-top: 24px; display: flex; gap: 10px; justify-content: flex-end; }
.sel-confirm-btn {
  min-width: 120px; height: 38px;
  padding: 0 16px;
  background: var(--panel2);
  border: none;
  border-radius: var(--r-sm);
  color: var(--ink);
  font: 600 14px var(--text);
}
.sel-confirm-btn.danger { background: var(--bad); color: var(--on-accent); }
.sel-confirm-btn.focused { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.sel-confirm-btn:hover { background: var(--panel3); }
.sel-confirm-btn.danger:hover { background: #ea866f; }

/* ---- pause / results / LINE-results panels (DOM) ----
 * Scrim + panel over the live canvas world; artboard px mirror the canvas
 * layouts. Shared .pan-* primitives; per-screen res-… / lr-… content. */
.screen-panel {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: auto;
  cursor: default;
  font-family: var(--text);
  color: var(--ink);
  user-select: none;
}
#screen-paused { background: rgba(13, 17, 15, 0.84); }
#screen-results { background: rgba(13, 17, 15, 0.86); }
#screen-lineresults { background: rgba(13, 17, 15, 0.8); }

.pan-title {
  position: absolute;
  top: 132px;
  font: 800 64px/1 var(--display);
  color: var(--ink);
  white-space: nowrap;
}
.pan-list {
  position: absolute;
  top: 229px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pan-btn {
  width: 340px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--panel);
  border: none;
  border-radius: var(--r-sm);
  color: var(--ink);
  font: 600 15px var(--text);
  transition: background-color 0.12s ease, color 0.12s ease;
}
.pan-btn .ic { width: 18px; height: 18px; }
.pan-btn .pan-state { color: var(--muted); font-weight: 400; }
.pan-btn:hover { background: var(--panel3); }
.pan-btn.focused { background: var(--accent); color: var(--on-accent); }
.pan-btn.focused .pan-state { color: var(--on-accent); opacity: 0.7; }
.pan-hint {
  position: absolute;
  top: 560px;
  font: 12px var(--text);
  color: var(--muted);
  white-space: nowrap;
}

/* ---- results ---- */
.res-practice {
  position: absolute; top: 40px;
  display: flex; align-items: center; gap: 6px;
  font: 600 13px var(--text); color: var(--accent);
  white-space: nowrap;
}
.res-practice .ic { width: 15px; height: 15px; }
.res-title {
  position: absolute; top: 62px;
  font: 800 48px/1 var(--display); color: var(--ink);
  white-space: nowrap;
}
.res-time {
  position: absolute; top: 114px;
  font: 800 30px/1 var(--display); color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.res-newbest { position: absolute; top: 150px; font: 600 13px var(--text); color: var(--accent); white-space: nowrap; }
.res-prevbest { position: absolute; top: 150px; font: 13px var(--text); color: var(--muted); white-space: nowrap; }
.res-stats { position: absolute; top: 170px; font: 13px var(--text); color: var(--ink-soft); white-space: nowrap; }
.res-alt { position: absolute; top: 190px; font: 600 13px var(--text); color: var(--gold); white-space: nowrap; }

.res-rankrow {
  position: absolute; top: 222px;
  display: flex; align-items: flex-start; justify-content: center;
  gap: 48px; width: 700px; left: 50%; transform: translateX(-50%);
}
.res-axis { width: 220px; text-align: center; }
.res-axis-title { font: 600 13px var(--text); color: var(--muted); }
.res-axis-grade { font: 800 38px/1 var(--display); margin-top: 6px; }
.res-axis-line { font: 11px/1.35 var(--text); color: var(--faint); margin-top: 2px; font-variant-numeric: tabular-nums; }
.res-axis-line.on { font-weight: 700; }
.res-axis-note { font: 12px var(--text); color: var(--ink-soft); margin-top: 6px; }
.res-seal { width: 140px; text-align: center; padding-top: 0; }
.res-seal-grade { font: 800 92px/1 var(--display); }
.res-seal-note { font: 11px var(--text); color: var(--muted); margin-top: 2px; }

.res-splits {
  position: absolute; left: 32px; top: 206px;
  padding: 14px 16px 12px;
  background: var(--panel);
  border-radius: var(--r);
  font: 12px var(--text); text-align: left;
  font-variant-numeric: tabular-nums;
}
.res-splits-title { font: 600 12px var(--text); color: var(--muted); margin-bottom: 6px; }
.res-split { display: flex; gap: 0; margin-top: 5px; color: var(--ink-soft); }
.res-split .rs-name { width: 34px; color: var(--muted); }
.res-split .rs-cum { width: 62px; }
.res-split .rs-delta { width: 52px; }
.res-split .rs-delta.ahead { color: var(--good); }
.res-split .rs-delta.behind { color: var(--bad); }
.res-split .rs-delta.none { color: var(--faint); }
.res-split .rs-gold { color: var(--gold); display: flex; align-items: center; }
.res-split .rs-gold .ic { width: 12px; height: 12px; }

.res-list { top: 452px; gap: 8px; }
.res-btn { width: 300px; height: 40px; font-size: 14px; }

/* ---- THE LINE results ---- */
.lr-title {
  position: absolute; top: 30px;
  font: 800 48px/1 var(--display); color: var(--ink);
  white-space: nowrap;
}
.lr-sub { position: absolute; top: 84px; font: 13px var(--text); color: var(--muted); white-space: nowrap; }
.lr-clock { position: absolute; top: 106px; font: 800 52px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.lr-clock.best { color: var(--accent); }
.lr-newbest { position: absolute; top: 162px; font: 600 13px var(--text); color: var(--accent); white-space: nowrap; }
.lr-deaths { position: absolute; top: 182px; font: 13px var(--text); color: var(--ink-soft); white-space: nowrap; }

.lr-splits {
  position: absolute; top: 212px;
  width: 560px;
  max-height: 268px;
  overflow-y: auto;
  padding: 4px;
  background: var(--panel);
  border-radius: var(--r);
  font: 13px var(--text);
  font-variant-numeric: tabular-nums;
}
.lr-split {
  display: flex; align-items: center;
  height: 30px;
  padding: 0 12px;
  border-radius: var(--r-sm);
}
.lr-split:nth-child(even) { background: rgba(255, 255, 255, 0.025); }
.lr-split .lr-name { flex: 1; color: var(--ink); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr-split .lr-dead { width: 80px; text-align: right; color: var(--bad); }
.lr-split .lr-clean { width: 80px; text-align: right; color: var(--muted); }
.lr-split .lr-t { width: 90px; text-align: right; color: var(--ink); }
.lr-split .lr-cum { width: 90px; text-align: right; color: var(--accent); }

.lr-list { top: 500px; gap: 8px; }
.lr-btn { width: 300px; height: 40px; font-size: 14px; }

/* absolute rows don't inherit the flex centering — pin every panel row to
 * the artboard's horizontal center explicitly (res-rankrow already does;
 * res-splits stays intentionally left-anchored) */
.pan-title, .pan-list, .pan-hint,
.res-practice, .res-title, .res-time, .res-newbest, .res-prevbest, .res-stats, .res-alt,
.lr-title, .lr-sub, .lr-clock, .lr-newbest, .lr-deaths, .lr-splits {
  left: 50%;
  transform: translateX(-50%);
}

/* ---- SKINS + SECRETS (DOM) ----
 * No scrim — like the select screen these float over the ambient canvas
 * background (only the gameplay panels dim the world behind). */
.sk-title, .sc-title, .set-title { top: 24px; font-size: 48px; }
.sk-sub {
  position: absolute; top: 76px; left: 50%; transform: translateX(-50%);
  font: 13px var(--text); color: var(--muted);
  white-space: nowrap; /* abspos shrink-to-fit wraps at the 50% edge otherwise */
}
.sk-sub kbd { font-size: 10.5px; }

.sk-grid {
  /* 21 skins → 11 rows in 2 cols; compacted so the last row clears BACK
     (~570). top 102 + 11×36 + 10×4 = 538 bottom. */
  position: absolute; top: 102px; left: 50%; transform: translateX(-50%);
  display: grid; grid-template-columns: 560px; gap: 4px;
}
.sk-grid.two { grid-template-columns: 476px 476px; column-gap: 12px; }
.sk-row {
  position: relative;
  height: 36px;
  display: flex; align-items: center; gap: 9px;
  padding: 0 14px 0 10px;
  background: var(--panel);
  border: none;
  border-radius: var(--r-sm);
  text-align: left;
  color: inherit;
}
.sk-row.locked { background: rgba(26, 33, 31, 0.55); }
button.sk-row:hover { background: var(--panel2); }
button.sk-row.focused { background: var(--panel2); box-shadow: inset 0 0 0 2px var(--accent); }
.sk-swatch-cv { width: 30px; height: 30px; flex: 0 0 auto; margin: 0 -4px 0 -4px; }
.sk-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sk-name { font: 600 13px/1.15 var(--text); color: var(--ink); }
.sk-row.locked .sk-name { color: var(--muted); }
.sk-need {
  display: flex; align-items: center; gap: 4px;
  font: 11px/1.2 var(--text); color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sk-need .ic { width: 11px; height: 11px; flex: none; }
.sk-row.locked .sk-need { color: var(--faint); }
.sk-equipped {
  margin-left: auto; flex: 0 0 auto;
  display: flex; align-items: center; gap: 4px;
  font: 600 12px var(--text); color: var(--accent);
}
.sk-equipped .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.sk-back, .sc-back { position: absolute; top: auto; bottom: 22px; }
.pan-back { width: 220px; height: 36px; font-size: 13px; }
.pan-back kbd { background: var(--panel3); }
.pan-back.focused kbd { background: rgba(18, 23, 21, 0.18); color: var(--on-accent); }

.sc-list {
  position: absolute; top: 116px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px;
}
.sc-empty { color: var(--muted); font: 15px var(--text); margin-top: 120px; text-align: center; white-space: nowrap; }
.sc-row {
  position: relative;
  width: 620px; height: 62px;
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px;
  background: var(--panel);
  border: none;
  border-radius: var(--r);
  text-align: left;
  color: inherit;
}
.sc-row.locked { background: rgba(26, 33, 31, 0.55); }
button.sc-row:hover { background: var(--panel2); }
button.sc-row.focused { background: var(--panel2); box-shadow: inset 0 0 0 2px var(--accent); }
.sc-diamond {
  width: 16px; height: 16px; flex: 0 0 auto;
  margin: 0 6px;
  background: var(--tint, var(--accent));
  border-radius: 2px;
  transform: rotate(45deg);
}
.sc-diamond.locked { opacity: 0.3; }
.sc-text { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.sc-name { font: 600 15px var(--text); color: var(--ink); }
.sc-row.locked .sc-name { color: var(--muted); }
.sc-cond { display: flex; align-items: center; gap: 5px; font: 12px var(--text); color: var(--muted); }
.sc-cond .ic { width: 12px; height: 12px; }
.sc-cond.open { color: var(--ink-soft); }
.sc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
.sc-progress { font: 12px var(--text); color: var(--muted); font-variant-numeric: tabular-nums; }
.sc-play { display: flex; align-items: center; gap: 4px; font: 600 13px var(--text); color: var(--ink-soft); }
.sc-play .ic { width: 12px; height: 12px; }
button.sc-row.focused .sc-play { color: var(--accent); }

/* ---- SETTINGS (DOM) ----
 * Two visual columns, one flat focus order. Canvas budget preserved
 * (ROADMAP checklist A: left worst ~558, right ~510, BACK 578). */
.set-col { position: absolute; top: 108px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.set-left { left: 96px; width: 420px; }
.set-right { left: 590px; width: 444px; gap: 4px; }
.set-head {
  display: flex; align-items: baseline; gap: 12px;
  font: 600 13px var(--text); color: var(--ink);
  margin: 0 0 4px 0;
}
.set-headnote { font: 12px var(--text); color: var(--muted); font-weight: normal; }
.set-padhead { margin-top: 12px; }

.set-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel);
  border: none;
  border-radius: var(--r-sm);
  padding: 0 14px;
  color: var(--ink-soft);
  font: 600 13px var(--text);
  text-align: left;
}
.set-row:hover { background: var(--panel2); color: var(--ink); }
.set-row.focused { background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 2px var(--accent); }
.set-slider { height: 36px; }
.set-label { flex: 0 0 auto; }
.set-slider .set-label { width: 150px; }
.set-bar {
  position: relative;
  width: 170px; height: 6px; flex: 0 0 auto;
  background: var(--panel3);
  border-radius: 3px;
  cursor: ew-resize;
}
.set-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: var(--muted);
  border-radius: 3px;
}
.set-row.focused .set-fill { background: var(--accent); }
.set-val { margin-left: auto; font: 700 16px/1 var(--display); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.set-row.focused .set-val { color: var(--ink); }
.set-toggle { height: 32px; justify-content: space-between; }
.set-state { font-weight: 600; }
.set-state.on { color: var(--accent); }
.set-state.off { color: var(--muted); }
.set-reset {
  height: 30px; justify-content: center;
  background: transparent;
  font: 600 12px var(--text); color: var(--muted);
}
.set-reset:hover { background: var(--panel); }

.set-pad { height: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font: 12px var(--text); }
.set-pad.active { color: var(--ink); }
.set-pad.active .set-padname { color: var(--accent); }
.set-pad.dead { color: var(--faint); background: none; }
.set-padinfo { color: var(--muted); }
.set-padnote { font: 12px var(--text); color: var(--muted); }
.set-padhint { font: 12px/1.7 var(--text); color: var(--muted); white-space: nowrap; }
.set-autopick { height: 22px; justify-content: center; font: 12px var(--text); background: none; color: var(--muted); }

.set-key { height: 26px; justify-content: space-between; font: 600 12px var(--text); }
.set-bind {
  min-width: 26px;
  padding: 2px 7px;
  border-radius: var(--r-sm);
  background: var(--panel2);
  color: var(--ink);
  font: 600 11px/1.4 var(--text);
  text-align: center;
}
.set-row.focused .set-bind, .set-row:hover .set-bind { background: var(--panel3); }
.set-key.waiting { box-shadow: inset 0 0 0 2px var(--gold); }
.set-bind.waiting { background: transparent; color: var(--gold); }
.set-rebindmsg { margin-top: 8px; text-align: center; font: 600 12px var(--text); color: var(--gold); }

.set-back { top: auto; bottom: 22px; }

/* ---- HUD chrome (DOM) ----
 * Exact canvas lanes (ROADMAP checklist A). pointer-events:none everywhere —
 * gameplay owns the mouse. contain + tabular-nums + transform-only fill keep
 * the per-frame sync off the layout path. Sits UNDER the pause/results
 * scrims (built before the panels — earlier sibling in #ui-root). A soft
 * offset shadow keeps the readouts legible over bright world art. */
#screen-hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  font-family: var(--text);
  color: var(--ink);
  contain: layout style;
  user-select: none;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
  font-variant-numeric: tabular-nums;
}
.hud-hearts { position: absolute; left: 14px; top: 14px; display: flex; gap: 3px; }
.hud-heart { width: 22px; height: 22px; color: #e5735f; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.6)); }
.hud-heart .ic { width: 22px; height: 22px; }
.hud-heart.empty { color: rgba(46, 57, 53, 0.9); }
.hud-name {
  position: absolute; left: 16px; top: 45px;
  display: flex; align-items: baseline; gap: 6px;
  font: 600 14px/1 var(--text); color: var(--ink);
}
.hud-name .hud-num { font: 600 14px/1 var(--text); color: var(--muted); }
.hud-timerow { position: absolute; left: 16px; top: 64px; display: flex; align-items: baseline; }
.hud-time {
  width: 132px; /* fixed column — the S-target never jitters */
  display: flex; align-items: baseline; gap: 7px;
  font: 800 21px/1 var(--display); color: var(--ink);
}
.hud-label { font: 600 12px/1 var(--text); color: var(--muted); }
.hud-starget { font: 600 13px/1 var(--text); color: var(--gold); }
.hud-starget.off { color: var(--faint); }
.hud-stats { position: absolute; left: 16px; top: 90px; font: 13px/1 var(--text); color: var(--ink-soft); }

.hud-dash { position: absolute; left: 16px; top: 112px; display: flex; align-items: center; }
.hud-dash-label { font: 600 12px var(--text); color: var(--muted); width: 42px; }
.hud-dash-bar {
  position: relative;
  width: 100px; height: 8px;
  background: rgba(13, 17, 15, 0.7);
  border-radius: 4px;
  overflow: hidden;
}
.hud-dash-fill {
  position: absolute; inset: 0;
  background: var(--hud-dim, #5d6b65);
  border-radius: 4px;
  transform-origin: left center;
}
.dash-ready .hud-dash-fill { background: var(--hud-ready, var(--accent)); }
.hud-dash-ready {
  margin-left: 8px;
  font: 600 12px var(--text);
  color: var(--hud-ready, var(--accent));
  visibility: hidden;
}
.dash-ready .hud-dash-ready { visibility: visible; }

.hud-line {
  position: absolute; right: 14px; top: 45px;
  font: 600 13px var(--text); color: var(--accent);
}
.hud-practice, .hud-playtest {
  position: absolute; left: 16px; top: 603px;
  display: flex; align-items: center; gap: 6px;
  font: 600 13px var(--text); color: var(--accent);
}
.hud-practice .ic { width: 15px; height: 15px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
